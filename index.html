<style>

:root{color-scheme:dark;--bg:#090909;--panel:#111;--muted:#888;--line:#292929;--gold:#b89a62;--white:#e9e6df}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% 35%,#191714 0,#0b0b0a 48%,#070707 100%);color:var(--white);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh;overflow-x:hidden}

.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid #c1a36b12;border-radius:50%;inset:9%}.orbit:after{inset:19%}
.content{position:relative;max-width:760px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:5px;margin-bottom:25px}
h1{font-size:clamp(55px,12vw,112px);line-height:1;margin:0 0 28px;letter-spacing:7px;font-weight:800;text-shadow:0 10px 55px #000}
.rule{width:66px;height:1px;background:var(--gold);margin:0 auto 28px}
.lead{font-size:clamp(15px,2.4vw,19px);font-weight:300;color:#bdb8ad;line-height:2.3;max-width:590px;margin:0 auto 42px}
.quote{min-height:92px;display:flex;align-items:center;justify-content:center;padding:15px 10px;color:#e8dfce;font-size:clamp(17px,3vw,23px);line-height:2;transition:opacity .35s}

<main class="hero"><div class="orbit"></div><section class="content">
<div class="eyebrow">POWER · THOUGHT · REALITY</div><h1>GODHAND</h1><div class="rule"></div>
<p class="lead">اینجا قرار نیست حقیقت را زیباتر کنیم؛<br>قرار است بی‌پرده‌تر به آن نگاه کنیم.</p>
<div class="quote" id="thought" aria-live="polite">قدرت، پیش از آن‌که در دست‌ها باشد، در شناخت واقعیت است.</div>
<div class="actions"><a class="btn primary" href="archive.html">ورود به کتابخانه</a><button class="btn" id="next" type="button">اندیشه‌ی بعدی ↻</button></div>
</section></main>
<footer><span>GODHAND · مستقل از هر پروژه‌ی دیگر</span><div class="social"><a href="https://t.me/AMORYG" target="_blank" rel="noopener noreferrer">TELEGRAM</a><a href="https://instagram.com/amir_afterr" target="_blank" rel="noopener noreferrer">INSTAGRAM</a></div></footer>
<script>
const thoughts=["قدرت، پیش از آن‌که در دست‌ها باشد، در شناخت واقعیت است.","کسی که هزینه‌ی تصمیم را نمی‌سنجد، دیر یا زود هزینه‌ی تردید را می‌پردازد.","ظاهر آرام، همیشه نشانه‌ی ذهن آرام نیست.","برای دیدن حقیقت، گاهی باید از چیزی که دوست داری باور کنی فاصله بگیری.","ترس، وقتی ناشناخته بماند، از خود خطر بزرگ‌تر می‌شود.","هیچ نقشه‌ای جای شناخت زمین بازی را نمی‌گیرد.","آدمی که خودش را نمی‌شناسد، آسان‌تر ابزار دیگران می‌شود."];
let last=-1;function nextThought(){let n;do{n=Math.floor(Math.random()*thoughts.length)}while(n===last&&thoughts.length>1);last=n;const el=document.getElementById("thought");el.style.opacity=0;setTimeout(()=>{el.textContent=thoughts[n];el.style.opacity=1},220)}
document.getElementById("next").addEventListener("click",nextThought);nextThought();
</script></body></html>
