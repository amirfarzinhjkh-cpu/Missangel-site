<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیام</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--heart-color:#fff;--heart-glow:rgba(255,255,255,.65);}
html,body{width:100%;height:100%;overflow:hidden;}
body{font-family:Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 42%,#101c32 0%,#050912 48%,#000 100%);transition:background 1.8s ease;}
body.day{background:radial-gradient(circle at 50% 40%,#182b45 0%,#08101d 48%,#020408 100%);}
body.dusk{background:radial-gradient(circle at 50% 42%,#24192c 0%,#0c0b18 48%,#020205 100%);}
body.night{background:radial-gradient(circle at 50% 42%,#0c1528 0%,#03060d 48%,#000 100%);}
#particles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.mouse-glow{position:fixed;width:260px;height:260px;border-radius:50%;pointer-events:none;z-index:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(70,130,255,.12) 0%,rgba(70,130,255,.045) 28%,transparent 70%);filter:blur(5px);}
.fog{position:fixed;width:150%;height:35%;left:-25%;pointer-events:none;z-index:3;opacity:.13;filter:blur(35px);background:radial-gradient(ellipse,rgba(190,210,235,.25),transparent 68%);}
.fog.one{bottom:8%;animation:fogMove 18s ease-in-out infinite alternate;}
.fog.two{bottom:-5%;opacity:.08;animation:fogMove 25s ease-in-out infinite alternate-reverse;}
@keyframes fogMove{from{transform:translateX(-7%) scale(1);}to{transform:translateX(7%) scale(1.08);}}
.container{position:relative;z-index:5;width:min(430px,92vw);height:100%;margin:auto;display:flex;justify-content:center;align-items:center;text-align:center;}
.question-screen{width:100%;animation:fadeIn 1s ease;}
.question{font-size:28px;font-weight:bold;margin-bottom:35px;text-shadow:0 0 25px rgba(255,255,255,.25);}
.choices{display:flex;justify-content:center;gap:15px;}
.choice{border:1px solid rgba(255,255,255,.18);color:white;background:rgba(255,255,255,.06);backdrop-filter:blur(12px);padding:13px 28px;border-radius:30px;cursor:pointer;font-size:16px;transition:.3s;}
.choice:hover{transform:translateY(-3px);background:rgba(255,255,255,.12);}
.result{min-height:30px;margin-top:25px;font-size:15px;}
.good{color:#fff;}
.bad{color:#ff7384;}
.main-screen{display:none;width:100%;animation:fadeIn 1.3s ease;}
.main-screen.active{display:block;}
.datetime{margin-bottom:22px;opacity:.85;text-shadow:0 0 15px rgba(255,255,255,.2);}
.date{font-size:14px;margin-bottom:5px;}
.time{font-size:24px;font-weight:bold;letter-spacing:1px;}
.dragon{font-size:42px;margin-bottom:14px;filter:drop-shadow(0 0 14px rgba(80,150,255,.25));animation:dragonFloat 4s ease-in-out infinite;}
@keyframes dragonFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.heart-area{position:relative;width:100%;height:320px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;}
.heart-wrap{position:relative;width:170px;height:170px;margin-top:5px;display:flex;align-items:center;justify-content:center;}
.heart{position:relative;width:125px;height:125px;background:var(--heart-color);transform:rotate(-45deg);border-radius:10px;cursor:pointer;box-shadow:0 0 20px var(--heart-glow),0 0 55px var(--heart-glow);animation:heartbeat 1.55s ease-in-out infinite;transition:background .7s ease,box-shadow .7s ease;z-index:3;}
.heart:before,.heart:after{content:"";position:absolute;width:125px;height:125px;background:var(--heart-color);border-radius:50%;transition:background .7s ease;}
.heart:before{top:-62px;left:0;}
.heart:after{top:0;left:62px;}
@keyframes heartbeat{0%,100%{transform:rotate(-45deg) scale(1);}8%{transform:rotate(-45deg) scale(1.08);}16%{transform:rotate(-45deg) scale(1);}24%{transform:rotate(-45deg) scale(1.06);}35%{transform:rotate(-45deg) scale(1);}}
.heart-text{position:absolute;z-index:6;width:135px;min-height:70px;left:50%;top:50%;transform:translate(-50%,-50%);color:#111;font-size:13px;line-height:1.8;font-weight:bold;pointer-events:none;direction:rtl;}
.heart-wrap.clicked{animation:heartShock .55s ease;}
@keyframes heartShock{0%{transform:scale(1);}25%{transform:scale(1.22);}50%{transform:scale(.92);}75%{transform:scale(1.1);}100%{transform:scale(1);}}
.ripple{position:absolute;width:145px;height:145px;border-radius:50%;border:2px solid var(--heart-color);opacity:.7;pointer-events:none;animation:ripple .75s ease-out forwards;z-index:1;}
@keyframes ripple{from{transform:scale(.6);opacity:.7;}to{transform:scale(1.8);opacity:0;}}
.ecg{position:absolute;top:185px;left:50%;transform:translateX(-50%);width:290px;height:75px;overflow:visible;filter:drop-shadow(0 0 5px var(--heart-glow));}
.ecg path{fill:none;stroke:var(--heart-color);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:400;stroke-dashoffset:400;animation:ecgDraw 2.4s linear infinite;}
@keyframes ecgDraw{to{stroke-dashoffset:0;}}
.greeting{margin-top:2px;font-size:19px;font-weight:bold;opacity:.92;}
.sub-greeting{margin-top:8px;font-size:12px;opacity:.5;}
.loading{width:170px;height:3px;margin:24px auto 18px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden;}
.loading span{display:block;width:0;height:100%;background:var(--heart-color);box-shadow:0 0 12px var(--heart-glow);animation:loading 3.5s ease forwards;}
@keyframes loading{to{width:100%;}}
.footer{font-size:10px;opacity:.35;}
.footer a{color:inherit;text-decoration:none;}
.visit-count{position:fixed;top:15px;left:15px;font-size:11px;color:#666;z-index:20;}
.shooting-star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;z-index:2;pointer-events:none;box-shadow:0 0 6px #fff,0 0 18px rgba(150,200,255,.9);animation:shoot 1.15s linear forwards;}
.shooting-star:after{content:"";position:absolute;right:2px;top:1px;width:120px;height:2px;transform-origin:right center;background:linear-gradient(to left,rgba(255,255,255,.8),transparent);}
@keyframes shoot{from{transform:translate(0,0);opacity:0;}8%{opacity:1;}100%{transform:translate(-330px,330px);opacity:0;}}
.sound-btn{position:fixed;left:18px;bottom:18px;z-index:20;width:42px;height:42px;border:1px solid rgba(255,255,255,.14);border-radius:50%;background:rgba(255,255,255,.05);color:#fff;cursor:pointer;backdrop-filter:blur(10px);font-size:17px;}
.intro{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:1;}
.intro.hide{animation:introHide 1s ease forwards;}
.intro-content{width:90%;text-align:center;position:relative;}
.intro-line{width:0;height:1px;margin:auto;background:#fff;box-shadow:0 0 15px #fff;animation:introLine 1.2s ease forwards;}
.intro-heart{margin:28px auto;width:70px;height:70px;background:#fff;transform:rotate(-45deg) scale(0);border-radius:8px;box-shadow:0 0 40px rgba(255,255,255,.6);animation:introHeart 1.1s .7s ease forwards;position:relative;}
.intro-heart:before,.intro-heart:after{content:"";position:absolute;width:70px;height:70px;background:#fff;border-radius:50%;}
.intro-heart:before{top:-35px;left:0;}
.intro-heart:after{top:0;left:35px;}
.intro-dragon{font-size:32px;opacity:0;animation:introDragon 1s .3s ease forwards;}
.intro-title{margin-top:12px;font-size:22px;opacity:0;letter-spacing:2px;animation:introText 1s 1.8s ease forwards;}
@keyframes introLine{to{width:180px;}}
@keyframes introHeart{to{transform:rotate(-45deg) scale(1);}}
@keyframes introDragon{to{opacity:1;}}
@keyframes introText{from{opacity:0;transform:translateY(10px);}to{opacity:.8;transform:translateY(0);}}
@keyframes introHide{to{opacity:0;visibility:hidden;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:500px){.question{font-size:25px;}.heart-area{height:305px;}.heart{width:112px;height:112px;}.heart:before,.heart:after{width:112px;height:112px;}.heart:before{top:-56px;}.heart:after{left:56px;}.heart-text{width:125px;font-size:12px;}.ecg{width:265px;top:178px;}.mouse-glow{display:none;}}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="mouse-glow" id="mouseGlow"></div>
<div class="fog one"></div>
<div class="fog two"></div>
<div class="visit-count" id="visitCount"></div>

<div class="intro" id="intro">
  <div class="intro-content">
    <div class="intro-line"></div>
    <div class="intro-dragon">🐉</div>
    <div class="intro-heart"></div>
    <div class="intro-title">بعضی چیزها اتفاقی نیستند...</div>
  </div>
</div>

<div class="container">
  <section class="question-screen" id="questionScreen">
    <div class="question">ماندن یا رفتن؟</div>
    <div class="choices">
      <button class="choice" onclick="answer('stay')">موندن 🤍</button>
      <button class="choice" onclick="answer('leave')">رفتن 🖤</button>
    </div>
    <div class="result" id="result"></div>
  </section>

  <section class="main-screen" id="mainScreen">
    <div class="datetime">
      <div class="date" id="date"></div>
      <div class="time" id="time"></div>
    </div>
    <div class="dragon">🐉</div>
    <div class="heart-area" id="heartArea">
      <div class="heart-wrap" id="heartWrap">
        <div class="heart" id="heart" onclick="heartClick()"></div>
        <div class="heart-text" id="heartText">هنوز اینجایی؟ 🤍</div>
      </div>
      <svg class="ecg" viewBox="0 0 300 80">
        <path d="M0 42 L55 42 L65 42 L72 20 L79 62 L87 42 L110 42 L120 42 L128 30 L135 52 L142 42 L170 42 L180 42 L188 17 L196 65 L204 42 L235 42 L245 42 L255 30 L262 53 L270 42 L300 42"/>
      </svg>
      <div class="greeting">خوش اومدی 🖤</div>
      <div class="sub-greeting">بعضی موندن‌ها دلیل خودشونو دارن...</div>
    </div>
    <div class="loading"><span></span></div>
    <div class="footer">
      ساخت شد توسط <a href="https://t.me/AMORYG" target="_blank">AMORYG 🗣️</a>
    </div>
  </section>
</div>

<button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔇</button>

<script>
const heartMessages = ["هنوز اینجایی؟ 🤍","بعضی موندن‌ها اتفاقی نیست...","شاید هنوز چیزی مونده.","گاهی سکوت، خودش یه جوابه.","تو برگشتی...","بعضی قلب‌ها فراموش نمی‌کنن.","شاید اینجا منتظر تو بود.","هنوز دیر نشده...","بعضی آدم‌ها از یاد نمی‌رن.","این بار، آروم‌تر بمون.","شاید دلت هنوز می‌دونه چرا.","همه چیز تموم نشده.","بعضی حس‌ها توضیح ندارن.","تو هنوز یه چیزی کم داری...","شاید جواب همین نزدیکی باشه.","هر رفتنی، پایان نیست.","بعضی نگاه‌ها موندگار می‌شن.","هنوز یه حرف نگفته هست.","شاید این قلب هنوز بیداره.","گاهی برگشتن، شروعه.","من هنوز یادم نرفته.","چیزی که واقعی باشه، گم نمی‌شه.","شاید خودت دلیل موندنتی.","این قصه هنوز تموم نشده.","اگر موندی، شاید دلیلی داشتی. 🖤","بعضی راه‌ها دوباره به هم می‌رسن.","شاید اینجا پایان نباشه.","گاهی دل، زودتر از عقل می‌فهمه.","تو هنوز توی این قصه‌ای.","شاید بعضی خاطره‌ها قرار نیست بمیرن."];
let messageIndex=0, typingTimer=null;

function typeHeartText(message){
  const text=document.getElementById("heartText");
  clearInterval(typingTimer);
  text.textContent="";
  let i=0;
  typingTimer=setInterval(()=>{
    text.textContent=message.slice(0,i+1);
    i++;
    if(i>=message.length) clearInterval(typingTimer);
  },38);
}

function heartClick(){
  const wrap=document.getElementById("heartWrap");
  const oldRipple=wrap.querySelector(".ripple");
  if(oldRipple) oldRipple.remove();
  const ripple=document.createElement("div");
  ripple.className="ripple";
  wrap.appendChild(ripple);
  wrap.classList.remove("clicked");
  void wrap.offsetWidth;
  wrap.classList.add("clicked");
  messageIndex++;
  if(messageIndex>=heartMessages.length) messageIndex=0;
  typeHeartText(heartMessages[messageIndex]);
  setTimeout(()=>{wrap.classList.remove("clicked");},550);
}

const heartColors=[{color:"#ffffff",glow:"rgba(255,255,255,.65)"},{color:"#32ff70",glow:"rgba(50,255,112,.6)"},{color:"#278dff",glow:"rgba(39,141,255,.65)"},{color:"#ff304d",glow:"rgba(255,48,77,.65)"}];
let colorIndex=0;
function changeHeartColor(){
  const area=document.getElementById("heartArea");
  const c=heartColors[colorIndex];
  area.style.setProperty("--heart-color",c.color);
  area.style.setProperty("--heart-glow",c.glow);
  colorIndex++;
  if(colorIndex>=heartColors.length) colorIndex=0;
}
setInterval(changeHeartColor,3000);

let introStarted=false;
function answer(choice){
  if(introStarted) return;
  const result=document.getElementById("result");
  if(choice==="stay"){
    introStarted=true;
    result.textContent="آفرین! جواب درست همینه 🤍";
    result.className="result good";
    setTimeout(()=>{
      document.getElementById("questionScreen").style.display="none";
      startMain();
    },900);
  }else{
    result.textContent="اشتباهه، دوباره فکر کن 😅";
    result.className="result bad";
  }
}

function toPersianNumber(value){
  return String(value).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
}

function updateDateTime(){
  const now=new Date();
  const date=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{year:"numeric",month:"long",day:"numeric"}).format(now);
  const hours=String(now.getHours()).padStart(2,"0");
  const minutes=String(now.getMinutes()).padStart(2,"0");
  const seconds=String(now.getSeconds()).padStart(2,"0");
  document.getElementById("date").textContent=date;
  document.getElementById("time").textContent=toPersianNumber(`${hours}:${minutes}:${seconds}`);
  updateTimeTheme(now.getHours());
}

function updateTimeTheme(hour){
  document.body.classList.remove("day","dusk","night");
  if(hour>=6 && hour<17) document.body.classList.add("day");
  else if(hour>=17 && hour<20) document.body.classList.add("dusk");
  else document.body.classList.add("night");
}

function sendTelegramNotification(){
  const now=new Date();
  const dateStr=now.toLocaleDateString('fa-IR');
  const timeStr=now.toLocaleTimeString('fa-IR');
  const ua=navigator.userAgent;
  let device="نامشخص";
  if(/android/i.test(ua)) device="Android";
  else if(/iphone|ipad/i.test(ua)) device="iPhone/iPad";
  else if(/windows/i.test(ua)) device="Windows";
  else if(/mac/i.test(ua)) device="Mac";
  fetch("https://ipapi.co/json/").then(res=>res.json()).then(data=>{
    const ip=data.ip||"نامشخص", city=data.city||"نامشخص", country=data.country_name||"نامشخص";
    const message="🔔 یک نفر سایت رو باز کرد!\n"+"تاریخ: "+dateStr+"\n"+"ساعت: "+timeStr+"\n"+"IP: "+ip+"\n"+"موقعیت: "+city+", "+country+"\n"+"دستگاه: "+device;
    fetch("https://api.telegram.org/bot8876078194:AAGHnxyzrNv6KpRC7VEePqVwvHDpA5Bwwqo/sendMessage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:"6606598485",text:message})});
  }).catch(()=>{
    const message="🔔 یک نفر سایت رو باز کرد!\n"+"تاریخ: "+dateStr+"\n"+"ساعت: "+timeStr+"\n"+"دستگاه: "+device;
    fetch("https://api.telegram.org/bot8876078194:AAGHnxyzrNv6KpRC7VEePqVwvHDpA5Bwwqo/sendMessage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:"6606598485",text:message})});
  });
}

function startMain(){
  const main=document.getElementById("mainScreen");
  main.classList.add("active");
  updateDateTime();
  setInterval(updateDateTime,1000);
  setTimeout(()=>{typeHeartText(heartMessages[0]);},700);
  sendTelegramNotification();
  fetch("https://api.countapi.xyz/hit/missangel-site/visits").then(res=>res.json()).then(data=>{document.getElementById("visitCount").innerText="بازدید: "+data.value;}).catch(()=>{});
}

setTimeout(()=>{document.getElementById("intro").classList.add("hide");},3300);

const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
let particles=[];
function resizeCanvas(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);
for(let i=0;i<50;i++){
  particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.5+0.4,dx:(Math.random()-0.5)*0.2,dy:(Math.random()-0.5)*0.2,alpha:Math.random()*0.5+0.2});
}
function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(180,200,255,${p.alpha})`;
    ctx.fill();
    p.x+=p.dx; p.y+=p.dy;
    if(p.x<0) p.x=canvas.width;
    if(p.x>canvas.width) p.x=0;
    if(p.y<0) p.y=canvas.height;
    if(p.y>canvas.height) p.y=0;
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

document.addEventListener("mousemove",(e)=>{
  const glow=document.getElementById("mouseGlow");
  glow.style.left=e.clientX+"px";
  glow.style.top=e.clientY+"px";
});

function spawnShootingStar(){
  const star=document.createElement("div");
  star.className="shooting-star";
  star.style.top=(Math.random()*40)+"%";
  star.style.left=(60+Math.random()*30)+"%";
  document.body.appendChild(star);
  setTimeout(()=>star.remove(),1200);
}
setInterval(()=>{
  if(Math.random()>0.5) spawnShootingStar();
},5000);

let audioCtx=null, soundOn=false, melodyTimeout=null;
const melodies={
  day:[523.25,587.33,659.25,587.33,523.25,659.25,783.99,659.25],
  dusk:[440,493.88,523.25,587.33,523.25,493.88,440,392],
  night:[329.63,349.23,392,349.23,329.63,293.66,261.63,293.66]
};
function getSlot(){
  const h=new Date().getHours();
  if(h>=6 && h<17) return "day";
  if(h>=17 && h<20) return "dusk";
  return "night";
}
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById("soundBtn").innerText=soundOn?"🔊":"🔇";
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(soundOn){audioCtx.resume(); playMelodyLoop();} else {stopMelody();}
}
function playNote(freq,time,duration){
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type="sine";
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(0,audioCtx.currentTime+time);
  gain.gain.linearRampToValueAtTime(0.07,audioCtx.currentTime+time+0.05);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+time+duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime+time);
  osc.stop(audioCtx.currentTime+time+duration+0.05);
}
function playMelodyLoop(){
  if(!soundOn) return;
  const notes=melodies[getSlot()];
  const noteDuration=0.55;
  notes.forEach((freq,i)=>{playNote(freq,i*noteDuration,noteDuration);});
  melodyTimeout=setTimeout(playMelodyLoop,notes.length*noteDuration*1000+800);
}
function stopMelody(){ if(melodyTimeout) clearTimeout(melodyTimeout); }
</script>
</body>
</html>
