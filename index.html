<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیام</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #000000;
    color: #f5f5f5;
    font-family: Tahoma, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  .box-wrapper {
    position: relative;
    width: 320px;
    height: 320px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #ffffff;
    border-right-color: #ffffff;
    animation: spin 2s linear infinite;
  }
  @keyframes spin {
    100% { transform: rotate(360deg); }
  }
  .box {
    width: 260px;
    height: 260px;
    background: #111111;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    text-align: center;
    z-index: 2;
  }
  .question {
    font-size: 20px;
    margin-bottom: 25px;
    color: #ffffff;
  }
  .options {
    display: flex;
    gap: 15px;
  }
  .option {
    padding: 10px 25px;
    border: 1px solid #555;
    border-radius: 10px;
    cursor: pointer;
    color: #cccccc;
    transition: 0.2s;
    background: transparent;
  }
  .option:active {
    background: #333;
  }
  .footer {
    position: fixed;
    bottom: 15px;
    right: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #888;
  }
  .footer a {
    display: flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    color: #8ab4f8;
  }
  .footer svg {
    width: 18px;
    height: 18px;
    fill: #29a9eb;
  }
  .result {
    font-size: 22px;
    color: #4caf50;
  }
</style>
</head>
<body>

  <div class="box-wrapper">
    <div class="ring"></div>
    <div class="box" id="box">
      <div class="question">ماندن یا رفتن؟</div>
      <div class="options">
        <div class="option" onclick="answer('رفتن')">رفتن</div>
        <div class="option" onclick="answer('ماندن')">ماندن</div>
      </div>
    </div>
  </div>

  <div class="footer">
    ساخت شد توسط AMORYG 🗣️
    <a href="https://t.me/AMORYG" target="_blank">
      <svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="120" fill="#29a9eb"/><path d="M52 122l32 10 12 38 22-24 34 24 24-116-124 48z" fill="#fff"/><path d="M84 132l64-48-52 56z" fill="#d2e5f1"/></svg>
    </a>
  </div>

<script>
  function answer(choice) {
    const box = document.getElementById('box');
    if (choice === 'ماندن') {
      box.innerHTML = '<div class="result">آفرین! جواب درست همینه 🤍</div>';
    } else {
      box.innerHTML = '<div class="result" style="color:#e53935;">اشتباهه، دوباره فکر کن 😅</div>';
    }
  }
</script>

</body>
</html>
