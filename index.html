<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیام</title>
<style>
  body {
    background-color: #0d0d0d;
    color: #f5f5f5;
    font-family: Tahoma, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background-color: #1a1a1a;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 0 25px rgba(255,255,255,0.05);
    max-width: 90%;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 20px;
  }
  p {
    font-size: 18px;
    line-height: 1.8;
    color: #cccccc;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>صبحتت بخیررررر 🤭</h1>
    <p>
      امیدوارم امروزت عالی باشه 🙂<br>
      امروز شاید کم پیدا باشم 🗣️<br>
      مراقب خودت باش 🫶🏻✨
    </p>
  </div>
</body>
</html>
