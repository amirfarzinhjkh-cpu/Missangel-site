<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پیام</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 50% 45%, #101c32 0%, #050912 45%, #000 100%);
    color:#fff;
    font-family:Tahoma, Arial, sans-serif;
}

/* پس زمینه */
#particles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
}

/* محتوای اصلی */
.container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:430px;
    padding:20px;
    text-align:center;
}

.hidden{
    display:none !important;
}

/* ---------------- صفحه اول ---------------- */

.test-screen{
    animation:fadeIn .8s ease;
}

.question{
    font-size:28px;
    font-weight:bold;
    margin-bottom:30px;
    text-shadow:
        0 0 10px #168cff,
        0 0 25px rgba(22,140,255,.5);
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
}

.choice{
    min-width:115px;
    padding:13px 20px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    background:rgba(15,23,38,.85);
    color:white;
    font-size:17px;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,120,255,.18);
    transition:.25s;
}

.choice:hover{
    transform:scale(1.05);
}

.result{
    min-height:28px;
    margin-top:20px;
    font-size:16px;
}

.good{
    color:#42ff8b;
    text-shadow:0 0 15px #00ff73;
}

.bad{
    color:#ff4d5f;
    text-shadow:0 0 15px #ff2038;
}

/* ---------------- صفحه اصلی ---------------- */

.main-screen{
    animation:fadeIn 1s ease;
}

/* تاریخ و ساعت */

.datetime{
    margin-bottom:24px;
    line-height:1.7;
}

.date{
    font-size:18px;
    font-weight:bold;
    letter-spacing:1px;
    color:#e7edf7;
    text-shadow:0 0 12px rgba(80,160,255,.35);
}

.time{
    margin-top:2px;
    font-size:17px;
    color:#91a2b9;
    direction:ltr;
}

/* ---------------- ابر ---------------- */

.cloud{
    position:relative;
    width:155px;
    height:62px;
    margin:0 auto 18px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:60px;

    background:rgba(190,215,255,.10);

    border:1px solid rgba(210,230,255,.18);

    box-shadow:
        0 0 25px rgba(60,150,255,.12),
        inset 0 0 20px rgba(255,255,255,.04);

    backdrop-filter:blur(8px);
}

/* حباب های ابر */

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(190,215,255,.10);
    border:1px solid rgba(210,230,255,.15);
}

.cloud::before{
    width:58px;
    height:58px;
    left:18px;
    top:-25px;
}

.cloud::after{
    width:70px;
    height:70px;
    right:18px;
    top:-35px;
}

/* اژدها */

.dragon{
    position:relative;
    z-index:5;

    font-size:43px;

    filter:
        drop-shadow(0 0 8px rgba(40,160,255,.7))
        drop-shadow(0 0 18px rgba(40,160,255,.3));

    animation:dragonFloat 2.5s ease-in-out infinite;
}

/* ---------------- قلب ---------------- */

.heart-area{
    position:relative;

    width:290px;
    height:260px;

    margin:0 auto 8px;

    display:flex;
    justify-content:center;
    align-items:center;
}

/*
   قلب واقعی با دو دایره و مربع چرخیده
*/

.heart{
    position:relative;

    width:145px;
    height:145px;

    transform:rotate(-45deg);

    background:#fff;

    border-radius:18px;

    animation:
        heartbeat 1.5s ease-in-out infinite,
        colorChange 12s infinite;

    box-shadow:
        0 0 20px currentColor,
        0 0 45px currentColor,
        0 0 80px currentColor;
}

.heart::before,
.heart::after{
    content:"";

    position:absolute;

    width:145px;
    height:145px;

    background:inherit;

    border-radius:50%;
}

.heart::before{
    top:-72px;
    left:0;
}

.heart::after{
    top:0;
    left:72px;
}

/* متن */

.heart-text{
    position:absolute;

    z-index:10;

    width:190px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    color:#050505;

    font-size:18px;
    font-weight:bold;

    line-height:1.7;

    text-align:center;

    pointer-events:none;
}

/* رنگ های قلب
   سفید → سبز → آبی → قرمز
*/

@keyframes colorChange{

    0%,24.99%{
        background:#fff;
        color:#fff;
    }

    25%,49.99%{
        background:#32ff70;
        color:#32ff70;
    }

    50%,74.99%{
        background:#278dff;
        color:#278dff;
    }

    75%,100%{
        background:#ff304d;
        color:#ff304d;
    }
}

/* ضربان قلب */

@keyframes heartbeat{

    0%,100%{
        transform:rotate(-45deg) scale(1);
    }

    50%{
        transform:rotate(-45deg) scale(1.07);
    }
}

/* شناور شدن اژدها */

@keyframes dragonFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

/* ---------------- متن پایین ---------------- */

.greeting{
    margin-top:0;

    font-size:21px;
    font-weight:bold;

    text-shadow:
        0 0 10px rgba(30,140,255,.7);
}

.loading{
    width:220px;
    height:4px;

    margin:20px auto;

    border-radius:10px;

    background:rgba(255,255,255,.08);

    overflow:hidden;
}

.loading span{
    display:block;

    width:0;
    height:100%;

    background:#3197ff;

    box-shadow:0 0 10px #3197ff;

    animation:loading 3s ease forwards;
}

@keyframes loading{
    to{
        width:100%;
    }
}

.footer{
    color:#68778d;
    font-size:12px;
    line-height:2;
}

.telegram{
    color:#38a9ff;
    text-decoration:none;
}

/* ---------------- دکمه صدا ---------------- */

.sound{
    position:fixed;

    left:18px;
    bottom:18px;

    z-index:20;

    width:45px;
    height:45px;

    padding:0;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(10,16,27,.85);

    color:white;

    font-size:20px;

    cursor:pointer;

    backdrop-filter:blur(8px);

    box-shadow:0 0 18px rgba(0,130,255,.15);
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>


<body>

<canvas id="particles"></canvas>

<!-- دکمه آهنگ -->
<button class="sound" id="soundBtn" onclick="toggleSound()">🔇</button>


<div class="container">

    <!-- صفحه سوال -->

    <div id="testScreen" class="test-screen">

        <div class="question">
            ماندن یا رفتن؟
        </div>

        <div class="buttons">

            <button class="choice" onclick="answer('stay')">
                ماندن 🤍
            </button>

            <button class="choice" onclick="answer('leave')">
                رفتن
            </button>

        </div>

        <div id="result" class="result"></div>

    </div>


    <!-- صفحه اصلی -->

    <div id="mainScreen" class="main-screen hidden">

        <!-- تاریخ و ساعت -->

        <div class="datetime">

            <div class="date" id="date">
                1405/06/31
            </div>

            <div class="time" id="time">
                10:10
            </div>

        </div>


        <!-- ابر + اژدها -->

        <div class="cloud">

            <div class="dragon">
                🐉
            </div>

        </div>


        <!-- قلب -->

        <div class="heart-area">

            <div class="heart">

                <div class="heart-text">
                    هنوز اینجایی؟ 🤍
                </div>

            </div>

        </div>


        <div class="greeting" id="greeting">
            خوش اومدی 🖤
        </div>


        <div class="loading">
            <span></span>
        </div>


        <div class="footer">

            ساخت شد توسط AMORYG 🗣️

            <br>

            <a
                class="telegram"
                href="https://t.me/AMORYG"
                target="_blank">
                Telegram
            </a>

        </div>

    </div>

</div>


<script>

/* =====================================================
   ذرات پس زمینه
===================================================== */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resizeCanvas(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


for(let i=0; i<75; i++){

    particles.push({

        x:Math.random()*window.innerWidth,

        y:Math.random()*window.innerHeight,

        size:Math.random()*1.8+0.5,

        speed:Math.random()*0.35+0.08,

        opacity:Math.random()*0.6+0.15

    });

}


function animateParticles(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(p=>{

        p.y -= p.speed;

        if(p.y < -5){

            p.y = canvas.height + 5;
            p.x = Math.random()*canvas.width;

        }

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            `rgba(70,160,255,${p.opacity})`;

        ctx.fill();

    });

    requestAnimationFrame(animateParticles);

}

animateParticles();


/* =====================================================
   جواب ماندن / رفتن
===================================================== */

function answer(choice){

    const result =
        document.getElementById("result");

    if(choice === "stay"){

        result.innerText =
            "آفرین! جواب درست همینه 🤍";

        result.className =
            "result good";


        setTimeout(()=>{

            document
                .getElementById("testScreen")
                .classList.add("hidden");

            document
                .getElementById("mainScreen")
                .classList.remove("hidden");

            showMain();

        },1500);

    }

    else{

        result.innerText =
            "اشتباهه، دوباره فکر کن 😅";

        result.className =
            "result bad";

    }

}


/* =====================================================
   تاریخ و ساعت
   فرمت:
   1405/06/31
   10:10
===================================================== */

function toPersianNumber(number){

    return String(number).replace(
        /\d/g,
        d => "۰۱۲۳۴۵۶۷۸۹"[d]
    );

}


function updateDateTime(){

    const now = new Date();


    /* تاریخ شمسی */

    const formatter =
        new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        );


    let date =
        formatter.format(now);


    /*
       تبدیل جداکننده ها
       به /
    */

    date =
        date.replace(/-/g,"/");


    document.getElementById("date")
        .innerText = date;


    /* ساعت */

    const hours =
        String(now.getHours()).padStart(2,"0");

    const minutes =
        String(now.getMinutes()).padStart(2,"0");


    document.getElementById("time")
        .innerText =
        `${toPersianNumber(hours)}:${toPersianNumber(minutes)}`;

}


/* =====================================================
   متن خوش آمد
===================================================== */

function getGreeting(){

    const hour =
        new Date().getHours();


    if(hour >= 5 && hour < 12)
        return "صبح بخیر 🖤";


    if(hour >= 12 && hour < 17)
        return "ظهر بخیر 🖤";


    if(hour >= 17 && hour < 21)
        return "عصر بخیر 🖤";


    return "شب بخیر 🖤";

}


/* =====================================================
   نمایش صفحه اصلی
===================================================== */

let clockStarted = false;

function showMain(){

    updateDateTime();

    document.getElementById("greeting")
        .innerText = getGreeting();


    if(!clockStarted){

        clockStarted = true;

        setInterval(updateDateTime,1000);

    }

}


/* =====================================================
   آهنگ فضایی
===================================================== */

let audioCtx = null;
let soundOn = false;
let melodyTimer = null;

const melody = [
    261.63,
    329.63,
    392.00,
    329.63,
    293.66,
    349.23,
    440.00,
    349.23
];


function playNote(freq){

    if(!audioCtx || !soundOn)
        return;


    const oscillator =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();


    oscillator.type = "sine";

    oscillator.frequency.value = freq;


    const now =
        audioCtx.currentTime;


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.045,
        now + 0.08
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 1.1
    );


    oscillator.connect(gain);

    gain.connect(audioCtx.destination);


    oscillator.start(now);

    oscillator.stop(now + 1.2);

}


function playMelody(){

    stopMelody();


    let index = 0;


    function next(){

        if(!soundOn)
            return;


        playNote(melody[index]);


        index++;


        if(index >= melody.length)
            index = 0;


        melodyTimer =
            setTimeout(next,900);

    }


    next();

}


function stopMelody(){

    if(melodyTimer){

        clearTimeout(melodyTimer);

        melodyTimer = null;

    }

}


async function toggleSound(){

    const button =
        document.getElementById("soundBtn");


    if(!audioCtx){

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if(audioCtx.state === "suspended"){

        await audioCtx.resume();

    }


    soundOn = !soundOn;


    if(soundOn){

        button.innerText = "🔊";

        playMelody();

    }

    else{

        button.innerText = "🔇";

        stopMelody();

    }

}

</script>

</body>
</html>
