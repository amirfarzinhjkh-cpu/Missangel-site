<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Living Dragon</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: #fff; font-family: Tahoma, Arial, sans-serif; height: 100vh; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; }

/* پس‌زمینه تصویر اصلی */
.bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; overflow: hidden; }
.bg-image { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.9) contrast(1.1); animation: subtleFloat 10s ease-in-out infinite alternate; }

/* اژدهای زنده (متحرک) با انیمیشن ۵ ثانیه‌ای نگاه کردن */
.living-dragon-wrapper { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 2; pointer-events: none; }
.living-dragon { width: 100%; height: 100%; object-fit: cover; animation: dragonLookAround 5s ease-in-out infinite; transform-origin: 55% 45%; }

/* انیمیشن چرخش و نگاه کردن اژدها هر ۵ ثانیه */
@keyframes dragonLookAround {
  0% { transform: scale(1) rotate(0deg) translate(0, 0); }
  35% { transform: scale(1.03) rotate(-1.5deg) translate(-8px, -4px); filter: brightness(1.15) contrast(1.15); }
  50% { transform: scale(1.04) rotate(-2deg) translate(-12px, -6px); filter: brightness(1.2) contrast(1.2); }
  70% { transform: scale(1.02) rotate(-0.8deg) translate(-5px, -2px); }
  100% { transform: scale(1) rotate(0deg) translate(0, 0); }
}

@keyframes subtleFloat {
  0% { transform: scale(1); }
  100% { transform: scale(1.02); }
}

/* ذره‌ها و افکت نور */
canvas#particles, canvas#lightningCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
canvas#particles { z-index: 3; }
canvas#lightningCanvas { z-index: 4; }

/* فوتر تلگرام */
.footer { position: fixed; bottom: 15px; right: 15px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #aaa; z-index: 5; background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 20px; backdrop-filter: blur(5px); }
.footer a { display: flex; align-items: center; gap: 5px; text-decoration: none; color: #8ab4f8; }
.footer svg { width: 18px; height: 18px; }

/* دکمه صدا */
.sound-toggle { position: fixed; top: 15px; right: 15px; z-index: 5; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; color: #fff; backdrop-filter: blur(5px); transition: 0.3s; }
.sound-toggle:hover { background: rgba(0,229,255,0.3); }
</style>
</head>
<body>

<div class="bg-container">
  <img class="bg-image" src="https://i.ibb.co/L5Q41K7/dragon-bg.jpg" alt="Dragon World" id="dragonBgImage">
  <div class="living-dragon-wrapper">
    <img class="living-dragon" src="https://i.ibb.co/L5Q41K7/dragon-bg.jpg" alt="Living Dragon">
  </div>
</div>

<canvas id="particles"></canvas>
<canvas id="lightningCanvas"></canvas>

<div class="sound-toggle" id="soundToggle" onclick="toggleDragonSound()">🔇</div>

<div class="footer">
ساخت شده توسط AMORYG 🗣️
<a href="https://t.me/AMORYG" target="_blank">
<svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="120" fill="#29a9eb"/><path d="M52 122l32 10 12 38 22-24 34 24 24-116-124 48z" fill="#fff"/><path d="M84 132l64-48-52 56z" fill="#d2e5f1"/></svg>
</a>
</div>

<script>
// ذره‌های معلق آتش و مه در فضا
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let particles = [];
for (let i = 0; i < 50; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2 + 0.5,
    dx: (Math.random() - 0.5) * 0.4,
    dy: -Math.random() * 0.5 - 0.2,
    alpha: Math.random() * 0.6 + 0.2
  });
}
function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220, 230, 255, ${p.alpha})`;
    ctx.fill();
    p.x += p.dx;
    p.y += p.dy;
    if (p.y < 0) p.y = canvas.height;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

// سیستم صدای واقعی اژدها
let audioCtx = null;
let soundOn = false;
let dragonRoarInterval = null;

function toggleDragonSound() {
  soundOn = !soundOn;
  document.getElementById('soundToggle').innerText = soundOn ? "🔊" : "🔇";
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  if (soundOn) {
    audioCtx.resume();
    playDragonRoar();
    dragonRoarInterval = setInterval(playDragonRoar, 6000);
  } else {
    if (dragonRoarInterval) clearInterval(dragonRoarInterval);
  }
}

// ساخت صدای غرش و نفس عمیق اژدها با AudioContext
function playDragonRoar() {
  if (!soundOn || !audioCtx) return;
  
  const now = audioCtx.currentTime;
  
  // صدای بم نفس و غرش سینمایی
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(45, now);
  osc.frequency.exponentialRampToValueAtTime(80, now + 0.8);
  osc.frequency.exponentialRampToValueAtTime(30, now + 2.5);

  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(200, now);
  filter.frequency.linearRampToValueAtTime(600, now + 0.8);
  filter.frequency.linearRampToValueAtTime(150, now + 2.5);

  gain.gain.setValueAtTime(0.01, now);
  gain.gain.linearRampToValueAtTime(0.25, now + 0.6);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 2.8);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 2.9);
}

// ارسال اطلاع‌رسانی به تلگرام
(function sendNotification() {
  const now = new Date();
  const dateStr = now.toLocaleDateString('fa-IR');
  const timeStr = now.toLocaleTimeString('fa-IR');
  const ua = navigator.userAgent;
  let device = "Android";
  if (/iphone|ipad/i.test(ua)) device = "iPhone/iPad"; else if (/windows/i.test(ua)) device = "Windows"; else if (/mac/i.test(ua)) device = "Mac";
  
  fetch("https://ipapi.co/json/").then(res => res.json()).then(data => {
    const ip = data.ip || "نامشخص"; const city = data.city || "نامشخص"; const country = data.country_name || "نامشخص";
    const message = "🔔 یک نفر سایت اژدهای سینمایی زنده رو باز کرد!\n" + "تاریخ: " + dateStr + "\n" + "ساعت: " + timeStr + "\n" + "IP: " + ip + "\n" + "موقعیت: " + city + ", " + country + "\n" + "دستگاه: " + device;
    fetch("https://api.telegram.org/bot8876078194:AAGhZL_t1yCNEDUO_4s15nS-oBpNi_qEUoQ/sendMessage", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: "6606598485", text: message }) });
  }).catch(() => {});
})();

window.addEventListener('resize', () => { 
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
});
</script>
</body>
</html>
