name: GODHAND checks
on:
  push:
    branches: [godhand-rebuild]
  pull_request:
    branches: [godhand-rebuild]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run build
